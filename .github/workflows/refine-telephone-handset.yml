name: Refine telephone handset

on:
  push:
    branches:
      - rewrite/astro-payload
    paths:
      - .github/workflows/refine-telephone-handset.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0

      - name: Apply handset refinement
        run: python3 scripts/refine-telephone-handset.py

      - name: Validate targeted changes
        shell: bash
        run: |
          git diff --check
          grep -q "const yokeHalfWidth = 0.245" apps/web/src/experience/operation-room.ts
          grep -q "const forkX = 0.355" apps/web/src/experience/operation-room.ts
          grep -q "const endX = side \* 0.425" apps/web/src/experience/operation-room.ts
          grep -q "bell.position.set(endX, 0.468, -0.055)" apps/web/src/experience/operation-room.ts
          if git diff -- apps/web/src/experience/operation-room.ts | grep -E "HOME_POSITION|RADIO_TARGET|cameraTransition|startZoomOut|focusRoute"; then
            echo "Unexpected camera/zoom modification"
            exit 1
          fi

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/refine-telephone-handset.yml scripts/refine-telephone-handset.py
          git add -A
          git commit -m "Refine telephone cradle and handset ends"
          git push origin rewrite/astro-payload
