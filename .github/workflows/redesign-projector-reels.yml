name: Redesign projector reels

on:
  push:
    branches:
      - rewrite/astro-payload
    paths:
      - .github/workflows/redesign-projector-reels.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0

      - name: Redesign projector reels
        run: python3 scripts/redesign-projector-reels.py

      - name: Validate targeted edit
        run: |
          git diff --check
          grep -q "const createOpenFilmReel" apps/web/src/experience/operation-room.ts
          grep -q "createOpenFilmReel(radius, openReelMetal, openReelDark)" apps/web/src/experience/operation-room.ts
          grep -q "createOpenFilmReel(radius, looseReelMetal, looseReelDark)" apps/web/src/experience/operation-room.ts

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/experience/operation-room.ts
          git rm scripts/redesign-projector-reels.py .github/workflows/redesign-projector-reels.yml
          git commit -m "Reuse open film reel model on projector"
          git push origin HEAD:rewrite/astro-payload
