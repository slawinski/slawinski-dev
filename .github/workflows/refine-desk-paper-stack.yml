name: Refine desk paper stack

on:
  push:
    branches:
      - 'rewrite/astro-payload'

permissions:
  contents: write

jobs:
  patch-desk-paper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0

      - name: Refine desk paper stack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/experience/operation-room.ts')
          text = path.read_text()

          old = """  // A substantial working pile sits on the desk in front of the trays, plus a
            // couple of loose sheets. This gives the WRITING area the busy, used-in-work
            // look of the supplied scene instead of an empty prop display.
            // The working pile occupies the footprint vacated by the right-hand lamp.
            // Keep it fully on the felt and below the lamp in the rotated WRITING view.
            const deskPapers = new THREE.Group(); deskPapers.position.set(-2.38, 1.305, 0.92)
            for (let i = 0; i < 11; i += 1) {
              deskPapers.add(box(
                [0.88 - i * 0.006, 0.011, 0.90 - i * 0.005],
                [i * 0.006, i * 0.012, i * -0.003],
                i % 4 === 0 ? materials.paper : materials.paperLight,
                [0, -0.055 + i * 0.008, 0],
              ))
            }
            deskPapers.add(box([0.68, 0.010, 0.68], [-0.42, 0.018, -0.30], materials.paper, [0, 0.14, 0]))
            deskPapers.add(box([0.76, 0.010, 0.72], [0.43, 0.022, -0.18], materials.paperLight, [0, -0.10, 0]))
            scene.add(deskPapers)
          """

          new = """  // A single working stack sits outside the trays. Its sheets use the same
            // A4-like footprint as the tray papers, but the whole stack is turned 90°
            // so it lies perpendicular to the trays. Keep the table free of loose pages.
            const deskPapers = new THREE.Group(); deskPapers.position.set(-2.38, 1.305, 0.92)
            for (let i = 0; i < 11; i += 1) {
              deskPapers.add(box(
                [1.22 - i * 0.012, 0.011, 0.76 - i * 0.006],
                [i * 0.006, i * 0.012, i * -0.003],
                i % 4 === 0 ? materials.paper : materials.paperLight,
                [0, Math.PI / 2 - 0.055 + i * 0.008, 0],
              ))
            }
            scene.add(deskPapers)
          """

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'desk paper block: expected exactly one match, found {count}')

          text = text.replace(old, new, 1)

          if 'context.beginPath(); context.moveTo(0, y); context.lineTo(canvas.width, y); context.stroke()' not in text:
              raise SystemExit('map horizontal grid regression detected')
          if 'deskPapers.add(box([0.68, 0.010, 0.68]' in text or 'deskPapers.add(box([0.76, 0.010, 0.72]' in text:
              raise SystemExit('loose desk pages still present')
          if '[1.22 - i * 0.012, 0.011, 0.76 - i * 0.006]' not in text:
              raise SystemExit('A4-like desk stack dimensions missing')
          if 'Math.PI / 2 - 0.055 + i * 0.008' not in text:
              raise SystemExit('perpendicular desk stack rotation missing')

          path.write_text(text)
          PY

          git diff --check
          git diff -- apps/web/src/experience/operation-room.ts
          git rm .github/workflows/refine-desk-paper-stack.yml

      - name: Commit desk paper refinement
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine writing desk paper stack'
          git push origin HEAD:rewrite/astro-payload
