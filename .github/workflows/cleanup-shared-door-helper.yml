name: Cleanup shared door helper

on:
  push:
    branches:
      - rewrite/astro-payload
    paths:
      - .github/workflows/cleanup-shared-door-helper.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0
      - run: python3 scripts/cleanup-shared-door-helper.py
      - run: git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/cleanup-shared-door-helper.yml scripts/cleanup-shared-door-helper.py
          git add -A
          git commit -m "Clean shared room door helper"
          git push origin rewrite/astro-payload
