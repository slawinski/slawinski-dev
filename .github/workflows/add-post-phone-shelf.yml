name: Add post phone shelf

on:
  push:
    branches:
      - rewrite/astro-payload
    paths:
      - .github/workflows/add-post-phone-shelf.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0

      - name: Add post-mounted phone shelf
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/add-post-phone-shelf.py
          python3 /tmp/add-post-phone-shelf.py

      - name: Validate patch
        shell: bash
        run: |
          grep -q "const createPostPhoneShelf" apps/web/src/experience/operation-room.ts
          grep -q "createPostPhoneShelf(scene)" apps/web/src/experience/operation-room.ts
          grep -q "rotationY = 0, y = 1.72, scale = 0.72" apps/web/src/experience/operation-room.ts

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-post-phone-shelf.yml
          git add -A
          git commit -m "Add post-mounted telephone shelf near doors"
          git push origin rewrite/astro-payload
