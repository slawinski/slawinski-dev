name: Add post phone shelf

on:
  push:
    branches:
      - rewrite/astro-payload
    paths:
      - .github/workflows/add-post-phone-shelf.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0

      - name: Add post-mounted phone shelf
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/experience/operation-room.ts')
          text = path.read_text()

          camera_start_marker = "  const getTraysViewPosition = () => {\n"
          camera_end_marker = "  const setProjectorActive = (active: boolean) => {\n"
          camera_start = text.index(camera_start_marker)
          camera_end = text.index(camera_end_marker)
          camera_before = text[camera_start:camera_end]

          old_signature = "const createPhone = (scene: THREE.Scene, x: number, z: number, color: number, rotationY = 0) => {"
          new_signature = "const createPhone = (scene: THREE.Scene, x: number, z: number, color: number, rotationY = 0, y = 1.72, scale = 0.72) => {"
          if old_signature not in text:
              raise SystemExit('createPhone signature not found')
          text = text.replace(old_signature, new_signature, 1)

          old_position = """  // The scaled phone base is aligned to the brown beam's top (y=1.70), with
  // only its underside touching the surface—no levitation or intersection.
  const group = new THREE.Group(); group.position.set(x, 1.72, z); group.rotation.y = rotationY
  group.scale.setScalar(0.72)
"""
          new_position = """  // The ordinary desk phones use the defaults; optional height/scale lets the
  // same period model sit naturally on smaller wall/post furniture as well.
  const group = new THREE.Group(); group.position.set(x, y, z); group.rotation.y = rotationY
  group.scale.setScalar(scale)
"""
          if old_position not in text:
              raise SystemExit('createPhone position block not found')
          text = text.replace(old_position, new_position, 1)

          helper = r'''
const createPostPhoneShelf = (scene: THREE.Scene) => {
  // Reference prop: a small telephone shelf fixed to the timber post nearest
  // the two doors. The post itself is at x=3.3 / z=-1.9; +Z faces into the room.
  const postX = 3.3
  const postZ = -1.9
  const postFrontZ = postZ + 0.31
  const shelfY = 2.04
  const shelfDepth = 0.62
  const shelfCenterZ = postFrontZ + shelfDepth / 2 - 0.01

  const shelfWood = makeMaterial(0x6e4426, 0.92); shelfWood.flatShading = true
  const bracketWood = makeMaterial(0x4d301d, 0.94); bracketWood.flatShading = true
  const conduit = makeMaterial(0x242927, 0.88); conduit.flatShading = true
  const terminal = makeMaterial(0xbab3a0, 0.92); terminal.flatShading = true

  // Thick little shelf with a back cleat physically touching the front face
  // of the structural post. Two diagonal braces keep it from reading as a
  // floating plank when seen from the home camera.
  scene.add(box([0.96, 0.10, shelfDepth], [postX, shelfY, shelfCenterZ], shelfWood))
  scene.add(box([0.78, 0.28, 0.08], [postX, shelfY - 0.15, postFrontZ + 0.035], bracketWood))
  for (const side of [-1, 1]) {
    scene.add(box(
      [0.075, 0.075, 0.48],
      [postX + side * 0.31, shelfY - 0.20, shelfCenterZ - 0.06],
      bracketWood,
      [-0.66, 0, 0],
    ))
  }

  // Surface conduit and a small junction block echo the reference telephone
  // installation and visually tie the shelf to the timber post.
  scene.add(cylinder(0.018, 1.25, [postX, 2.86, postFrontZ + 0.045], conduit, 7))
  scene.add(box([0.18, 0.26, 0.10], [postX, 2.56, postFrontZ + 0.055], terminal))
  scene.add(box([0.12, 0.16, 0.025], [postX, 2.56, postFrontZ + 0.118], conduit))

  // The same detailed Bakelite phone used on the main table, scaled down to
  // fit the shelf. Its rotary-dial face points into the room (+Z).
  const shelfTop = shelfY + 0.05
  createPhone(scene, postX, shelfCenterZ + 0.03, PALETTE.red, 0, shelfTop + 0.018, 0.58)

  // A short black lead drops from the junction box toward the set.
  const cableCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(postX + 0.05, 2.43, postFrontZ + 0.11),
    new THREE.Vector3(postX + 0.11, 2.30, postFrontZ + 0.18),
    new THREE.Vector3(postX + 0.15, 2.18, shelfCenterZ - 0.13),
    new THREE.Vector3(postX + 0.23, shelfTop + 0.18, shelfCenterZ + 0.02),
  ])
  const cable = new THREE.Mesh(new THREE.TubeGeometry(cableCurve, 9, 0.010, 5, false), materials.black)
  cable.castShadow = true
  scene.add(cable)
}

'''
          marker = "const createDeskLamp = (scene: THREE.Scene, x: number, z: number, scale = 1, rotationY = 0) => {"
          marker_index = text.index(marker)
          text = text[:marker_index] + helper + text[marker_index:]

          old_calls = "  createPhone(scene, -0.6, -2.0, 0x315b3c, 0); createPhone(scene, -0.6, -1.0, 0xd8ceb0, 1.57); createPhone(scene, -0.6, 0, PALETTE.red, -1.57); createPhone(scene, -0.6, 1.0, 0xd9d1b8, 1.57); createPhone(scene, -0.6, 2.0, 0x315b3c, -1.57)\n"
          new_calls = old_calls + "  createPostPhoneShelf(scene)\n"
          if old_calls not in text:
              raise SystemExit('main phone call row not found')
          text = text.replace(old_calls, new_calls, 1)

          camera_start_after = text.index(camera_start_marker)
          camera_end_after = text.index(camera_end_marker)
          if text[camera_start_after:camera_end_after] != camera_before:
              raise SystemExit('camera/zoom transition changed unexpectedly')

          path.write_text(text)
          PY

      - name: Validate patch
        shell: bash
        run: |
          grep -q "const createPostPhoneShelf" apps/web/src/experience/operation-room.ts
          grep -q "createPostPhoneShelf(scene)" apps/web/src/experience/operation-room.ts
          grep -q "rotationY = 0, y = 1.72, scale = 0.72" apps/web/src/experience/operation-room.ts

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-post-phone-shelf.yml
          git add -A
          git commit -m "Add post-mounted telephone shelf near doors"
          git push origin rewrite/astro-payload
