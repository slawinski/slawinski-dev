name: Refine writing lamps v2

on:
  push:
    branches:
      - 'rewrite/astro-payload'

permissions:
  contents: write

jobs:
  patch-writing-lamps:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0

      - name: Refine lamps without touching camera transitions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/experience/operation-room.ts')
          text = path.read_text()

          camera_start_marker = "  const getTraysViewPosition = () => {\n"
          camera_end_marker = "  const setProjectorActive = (active: boolean) => {\n"
          camera_start = text.index(camera_start_marker)
          camera_end = text.index(camera_end_marker, camera_start)
          camera_before = text[camera_start:camera_end]

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          """  group.add(cylinder(0.026 * scale, 0.48 * scale, [0, 1.42, 0], brass, 10))
            group.add(cylinder(0.052 * scale, 0.055 * scale, [0, 1.64, 0], brassDark, 10))
            const neckCurve = new THREE.CatmullRomCurve3([
              new THREE.Vector3(0, 1.64, 0),
              new THREE.Vector3(0, 1.70, 0.015),
              new THREE.Vector3(0, 1.73, 0.075),
              new THREE.Vector3(0, 1.74, 0.13),
            ])
          """,
          """  // Taller banker's-lamp stem. The base stays planted on the desk while
            // the shade is raised enough to clear the paperwork in the top-down view.
            group.add(cylinder(0.026 * scale, 0.86 * scale, [0, 1.61, 0], brass, 10))
            group.add(cylinder(0.052 * scale, 0.055 * scale, [0, 2.04, 0], brassDark, 10))
            const neckCurve = new THREE.CatmullRomCurve3([
              new THREE.Vector3(0, 2.04, 0),
              new THREE.Vector3(0, 2.10, 0.015),
              new THREE.Vector3(0, 2.13, 0.075),
              new THREE.Vector3(0, 2.14, 0.13),
            ])
          """,
          'taller desk-lamp stem',
          )

          replace_once(
          """  const shadeBottomY = 1.70
            const shadeTopY = 1.86
          """,
          """  const shadeBottomY = 2.10
            const shadeTopY = 2.26
          """,
          'raise desk-lamp shade',
          )

          replace_once(
          """  const chainX = 0.34 * scale
            group.add(cylinder(0.009 * scale, 0.18 * scale, [chainX, 1.60, shadeZ + 0.10], brassDark, 6))
            group.add(cylinder(0.026 * scale, 0.035 * scale, [chainX, 1.50, shadeZ + 0.10], brass, 8))
          """,
          """  const chainX = 0.34 * scale
            group.add(cylinder(0.009 * scale, 0.18 * scale, [chainX, 2.00, shadeZ + 0.10], brassDark, 6))
            group.add(cylinder(0.026 * scale, 0.035 * scale, [chainX, 1.90, shadeZ + 0.10], brass, 8))
          """,
          'raise desk-lamp pull chain',
          )

          replace_once(
          """  const deskPapers = new THREE.Group(); deskPapers.position.set(-1.70, 1.305, 0.92)
            for (let i = 0; i < 11; i += 1) {
              deskPapers.add(box(
                [1.34 - i * 0.008, 0.011, 0.90 - i * 0.005],
          """,
          """  // The working pile occupies the footprint vacated by the right-hand lamp.
            // Keep it fully on the felt and below the lamp in the rotated WRITING view.
            const deskPapers = new THREE.Group(); deskPapers.position.set(-2.38, 1.305, 0.92)
            for (let i = 0; i < 11; i += 1) {
              deskPapers.add(box(
                [0.88 - i * 0.006, 0.011, 0.90 - i * 0.005],
          """,
          'move papers into cleared lamp footprint',
          )

          replace_once(
          """  deskPapers.add(box([0.92, 0.010, 0.68], [-0.62, 0.018, -0.30], materials.paper, [0, 0.14, 0]))
            deskPapers.add(box([1.02, 0.010, 0.72], [0.64, 0.022, -0.18], materials.paperLight, [0, -0.10, 0]))
          """,
          """  deskPapers.add(box([0.68, 0.010, 0.68], [-0.42, 0.018, -0.30], materials.paper, [0, 0.14, 0]))
            deskPapers.add(box([0.76, 0.010, 0.72], [0.43, 0.022, -0.18], materials.paperLight, [0, -0.10, 0]))
          """,
          'keep loose papers inside cleared area',
          )

          replace_once(
          """  const trayLampRear = createDeskLamp(scene, -2.25, -1.15, 0.9, -0.04)
            const trayLampFront = createDeskLamp(scene, -2.25, 0.85, 0.92, 0.03)
          """,
          """  const trayLampRear = createDeskLamp(scene, -2.25, -1.15, 0.9, -0.04)
            // In the rotated top-down WRITING view +X is screen-up. Move the
            // right-hand lamp upward, but stop before its shade reaches the raised
            // brown centre box (which begins at x = -1.20).
            const trayLampFront = createDeskLamp(scene, -1.68, 0.85, 0.92, 0.03)
          """,
          'move right tray lamp upward without clipping centre box',
          )

          tray_start_marker = "  } else if (id === 'trays') {\n"
          tray_end_marker = "  } else if (id === 'projector') {\n"
          tray_start = text.index(tray_start_marker)
          tray_end = text.index(tray_end_marker, tray_start)
          tray_branch = """  } else if (id === 'trays') {
            // No detached/fallback tray light: the two physical desk lamps are
            // the only WRITING hover-light sources. Each pool starts at a shade
            // opening and lands on one half of the tray stack.
            sources = lightSources.map((source) => source.clone())
            targets = [
              new THREE.Vector3(position[0] - 0.10, 1.43, position[2] - 0.30),
              new THREE.Vector3(position[0] + 0.08, 1.41, position[2] + 0.34),
            ]
            radius = 0.88
            intensity = 9.5
          """
          text = text[:tray_start] + tray_branch + text[tray_end:]

          camera_start_after = text.index(camera_start_marker)
          camera_end_after = text.index(camera_end_marker, camera_start_after)
          camera_after = text[camera_start_after:camera_end_after]
          if camera_after != camera_before:
              raise SystemExit('camera/zoom transition changed unexpectedly')

          if 'context.beginPath(); context.moveTo(0, y); context.lineTo(canvas.width, y); context.stroke()' not in text:
              raise SystemExit('map horizontal grid regression detected')
          if 'const shadeBottomY = 2.10' not in text:
              raise SystemExit('taller lamp geometry missing')
          if 'createDeskLamp(scene, -1.68, 0.85' not in text:
              raise SystemExit('right lamp move missing')
          if 'sources = lightSources.map((source) => source.clone())' not in text:
              raise SystemExit('physical tray sources missing')
          if ': [new THREE.Vector3(position[0], 2.0' in text:
              raise SystemExit('detached tray fallback still present')
          if 'deskPapers.position.set(-2.38, 1.305, 0.92)' not in text:
              raise SystemExit('paper move missing')

          path.write_text(text)
          PY

          git diff --check
          git diff -- apps/web/src/experience/operation-room.ts

          # One-shot workflow: remove itself in the same functional commit so it
          # cannot race or overwrite later user changes.
          git rm .github/workflows/refine-writing-lamps-v2.yml

      - name: Commit writing lamp refinement
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/experience/operation-room.ts .github/workflows/refine-writing-lamps-v2.yml
          git commit -m 'Refine writing desk lamps without changing camera transition'
          git push origin HEAD:rewrite/astro-payload
