name: Improve writing trays and desk lights

on:
  push:
    branches:
      - 'rewrite/astro-payload'

permissions:
  contents: write

jobs:
  patch-writing-area:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0

      - name: Patch writing trays and light sources
        run: python scripts/improve-writing-trays-and-lights.py

      - name: Commit writing-area improvements
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/experience/operation-room.ts
          git commit -m 'Improve writing trays and desk-lamp hover lighting'
          git push origin HEAD:rewrite/astro-payload
