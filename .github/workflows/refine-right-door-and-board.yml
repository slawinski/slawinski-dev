name: Refine right door and hanging board

on:
  push:
    branches:
      - 'rewrite/astro-payload'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0
      - name: Refine room details
        run: python scripts/refine-right-door-and-board.py
      - name: Validate patch
        run: git diff --check
      - name: Commit scene update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refine-right-door-and-board.yml scripts/refine-right-door-and-board.py
          git add apps/web/src/experience/operation-room.ts
          git commit -m 'Refine right door and hanging board'
          git push origin HEAD:rewrite/astro-payload
