name: Split film reels

on:
  push:
    branches:
      - rewrite/astro-payload
    paths:
      - .github/workflows/split-film-reels.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0

      - name: Move two reels out of the box
        run: python3 scripts/split-film-reels.py

      - name: Validate targeted edit
        run: |
          grep -q "const canCount = 3" apps/web/src/experience/operation-room.ts
          grep -q "addLooseTableReel(0.235" apps/web/src/experience/operation-room.ts
          grep -q "addLooseTableReel(0.205" apps/web/src/experience/operation-room.ts
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/split-film-reels.yml scripts/split-film-reels.py
          git add apps/web/src/experience/operation-room.ts
          git commit -m "Move two film reels from box onto table"
          git push origin rewrite/astro-payload
