name: Add projector film storage

on:
  push:
    branches:
      - 'rewrite/astro-payload'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0
      - name: Add film reel storage props
        run: python scripts/add-projector-film-storage.py
      - name: Validate patch
        run: git diff --check
      - name: Commit scene update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-projector-film-storage.yml scripts/add-projector-film-storage.py
          git add apps/web/src/experience/operation-room.ts
          git commit -m 'Add film reel storage beside projector'
          git push origin HEAD:rewrite/astro-payload
