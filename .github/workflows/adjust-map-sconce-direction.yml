name: Adjust map sconce direction

on:
  push:
    branches:
      - 'rewrite/astro-payload'

permissions:
  contents: write

jobs:
  patch-map-sconce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0

      - name: Reposition map sconce and cone
        run: python scripts/adjust-map-sconce-direction.py

      - name: Commit map sconce positioning
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/experience/operation-room.ts
          git commit -m 'Center map sconce and straighten spotlight cone'
          git push origin HEAD:rewrite/astro-payload
