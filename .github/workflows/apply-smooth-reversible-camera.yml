name: Apply smooth reversible camera

on:
  push:
    branches:
      - 'rewrite/astro-payload'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply-smooth-reversible-camera.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-smooth-reversible-camera.yml scripts/apply-smooth-reversible-camera.py
          git add apps/web/src/experience/operation-room.ts
          git commit -m 'Make focus camera motion smooth and exactly reversible'
          git push origin HEAD:rewrite/astro-payload
