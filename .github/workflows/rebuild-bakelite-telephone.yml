name: Rebuild Bakelite telephone

on:
  push:
    branches:
      - rewrite/astro-payload
    paths:
      - .github/workflows/rebuild-bakelite-telephone.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0

      - name: Replace telephone model from scratch
        shell: bash
        run: |
          sed -i "s/) < 7:/) < 6:/" scripts/rebuild-bakelite-telephone.py
          python3 scripts/rebuild-bakelite-telephone.py

      - name: Validate replacement
        shell: bash
        run: |
          grep -q "const createRotaryTelephone" apps/web/src/experience/operation-room.ts
          grep -q "Authored faceted hull" apps/web/src/experience/operation-room.ts
          grep -q "const openingCount = 8" apps/web/src/experience/operation-room.ts
          grep -q "createRotaryTelephone(scene, shelfCenterX" apps/web/src/experience/operation-room.ts
          if grep -q "const createPhone" apps/web/src/experience/operation-room.ts; then exit 1; fi

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/rebuild-bakelite-telephone.yml scripts/rebuild-bakelite-telephone.py
          git add -A
          git commit -m "Rebuild 1940s Bakelite telephone from scratch"
          git push origin rewrite/astro-payload
