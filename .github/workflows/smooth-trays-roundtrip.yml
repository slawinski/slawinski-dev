name: Smooth trays round-trip camera

on:
  push:
    branches:
      - 'rewrite/astro-payload'

permissions:
  contents: write

jobs:
  patch-trays-camera:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0

      - name: Make trays zoom continuous and exactly reversible
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/experience/operation-room.ts')
          text = path.read_text()

          old_type = """    traysSequence?: {
              forwardPosition: THREE.Vector3
              forwardTarget: THREE.Vector3
              turnPosition: THREE.Vector3
              turnTarget: THREE.Vector3
            }
            destination: 'home' | 'map' | 'radio' | 'trays' | 'closet'
          } | null = null
          """
          new_type = """    targetPath?: THREE.Curve<THREE.Vector3>
            reversePath?: boolean
            destination: 'home' | 'map' | 'radio' | 'trays' | 'closet'
          } | null = null
            let traysRoundTrip: {
              path: THREE.Curve<THREE.Vector3>
              targetPath: THREE.Curve<THREE.Vector3>
              startUp: THREE.Vector3
              endUp: THREE.Vector3
              duration: number
            } | null = null
          """
          if old_type not in text:
              raise SystemExit('camera transition type marker not found')
          text = text.replace(old_type, new_type, 1)

          trays_start = text.index("  const startTraysDolly = () => {\n")
          closet_start = text.index("  const startClosetDolly = () => {\n", trays_start)
          trays_block = """  const startTraysDolly = () => {
            if (viewMode !== 'home') return
            controls.enabled = false

            clearHoverHighlights()
            hotspots.forEach((hotspot) => { hotspot.highlight.visible = false })
            boardDraw('WRITING')

            const end = getTraysViewPosition()
            if (reducedMotion.matches) {
              camera.position.copy(end)
              cameraTarget.copy(TRAYS_TARGET)
              controls.target.copy(TRAYS_TARGET)
              camera.up.copy(TRAYS_UP)
              viewMode = 'trays'
              settleControls(false)
              setZoomOutVisible(true)
              return
            }

            const start = camera.position.clone()
            const startTarget = controls.target.clone()
            const forwardDirection = startTarget.clone().sub(start).normalize()

            // One continuous motion-control spline: it still reads as forward
            // move -> right turn -> tilt down, but there are no phase boundaries
            // and therefore no intermediate easing slowdowns or micro-stops.
            const forwardPosition = start.clone().addScaledVector(forwardDirection, 4.15)
            const forwardTarget = startTarget.clone().addScaledVector(forwardDirection, 4.15)
            const turnPosition = new THREE.Vector3(
              TRAYS_TARGET.x - 2.45,
              TRAYS_TARGET.y + 1.55,
              TRAYS_TARGET.z + 0.10,
            )
            const turnTarget = new THREE.Vector3(
              TRAYS_TARGET.x + 0.65,
              TRAYS_TARGET.y + 0.95,
              TRAYS_TARGET.z,
            )
            const preTopPosition = new THREE.Vector3(
              TRAYS_TARGET.x - 0.72,
              TRAYS_TARGET.y + Math.max(2.25, end.y - TRAYS_TARGET.y - 0.42),
              TRAYS_TARGET.z + 0.04,
            )
            const preTopTarget = new THREE.Vector3(
              TRAYS_TARGET.x + 0.12,
              TRAYS_TARGET.y + 0.28,
              TRAYS_TARGET.z,
            )

            const path = new THREE.CatmullRomCurve3(
              [start, forwardPosition, turnPosition, preTopPosition, end],
              false,
              'centripetal',
            )
            const targetPath = new THREE.CatmullRomCurve3(
              [startTarget, forwardTarget, turnTarget, preTopTarget, TRAYS_TARGET.clone()],
              false,
              'centripetal',
            )
            const duration = 3200

            traysRoundTrip = {
              path,
              targetPath,
              startUp: camera.up.clone(),
              endUp: TRAYS_UP.clone(),
              duration,
            }
            cameraTransition = {
              startTime: performance.now(),
              duration,
              path,
              targetPath,
              reversePath: false,
              startTarget,
              endTarget: TRAYS_TARGET.clone(),
              startUp: traysRoundTrip.startUp.clone(),
              endUp: traysRoundTrip.endUp.clone(),
              destination: 'trays',
            }
            setZoomOutVisible(false)
            viewMode = 'transition'
          }
          """
          text = text[:trays_start] + trays_block + text[closet_start:]

          zoom_start = text.index("  const startZoomOut = () => {\n")
          dolly_start = text.index("  const dolly = (direction: 1 | -1) => {\n", zoom_start)
          zoom_block = """  const startZoomOut = () => {
            if (viewMode !== 'map' && viewMode !== 'radio' && viewMode !== 'trays' && viewMode !== 'closet') return
            const sourceView = viewMode
            setZoomOutVisible(false)
            closetTargetProgress = 0

            if (reducedMotion.matches) {
              resetView()
              return
            }

            // WRITING zoom-out is literally the zoom-in timeline backwards:
            // same position spline, same look-target spline, same roll/tilt curve,
            // same duration and one global easing function. No approximation.
            if (sourceView === 'trays' && traysRoundTrip) {
              cameraTransition = {
                startTime: performance.now(),
                duration: traysRoundTrip.duration,
                path: traysRoundTrip.path,
                targetPath: traysRoundTrip.targetPath,
                reversePath: true,
                startTarget: traysRoundTrip.targetPath.getPointAt(0),
                endTarget: traysRoundTrip.targetPath.getPointAt(1),
                startUp: traysRoundTrip.startUp.clone(),
                endUp: traysRoundTrip.endUp.clone(),
                destination: 'home',
              }
              viewMode = 'transition'
              return
            }

            const start = camera.position.clone()
            const direction = HOME_POSITION.clone().sub(start)
            const firstGuide = start.clone().addScaledVector(direction, 0.30).add(new THREE.Vector3(0, 0.08, 0.10))
            const secondGuide = start.clone().addScaledVector(direction, 0.72).add(new THREE.Vector3(0.08, 0.08, 0.16))
            cameraTransition = {
              startTime: performance.now(),
              duration: 1850,
              path: new THREE.CubicBezierCurve3(start, firstGuide, secondGuide, HOME_POSITION.clone()),
              startTarget: controls.target.clone(),
              endTarget: HOME_TARGET.clone(),
              startUp: camera.up.clone(),
              endUp: HOME_UP.clone(),
              destination: 'home',
            }
            viewMode = 'transition'
          }
          """
          text = text[:zoom_start] + zoom_block + text[dolly_start:]

          render_start = text.index("    if (cameraTransition) {\n")
          render_end = text.index("\n    if (cameraTransition || viewMode !== 'home') {", render_start)
          render_block = """    if (cameraTransition) {
              const transition = cameraTransition
              const elapsed = now - transition.startTime
              const progress = Math.min(elapsed / transition.duration, 1)
              const eased = easeMotionControl(progress)

              if (transition.targetPath) {
                // The trays move has one continuous parameter. getPointAt keeps
                // translation close to constant-speed through the curved turn;
                // the fifth-order easing is applied only once to the whole shot.
                const pathProgress = transition.reversePath ? 1 - eased : eased
                camera.position.copy(transition.path.getPointAt(pathProgress))
                cameraTarget.copy(transition.targetPath.getPointAt(pathProgress))

                // Preserve the established choreography: stay upright through
                // the forward move/right turn, then smoothly roll into the final
                // 90-degree top-down view. Because this is a pure function of the
                // shared path parameter, reversing the parameter reverses the
                // orientation exactly as well.
                const tiltStart = 0.60
                const tiltProgress = THREE.MathUtils.clamp((pathProgress - tiltStart) / (1 - tiltStart), 0, 1)
                const tilt = easeMotionControl(tiltProgress)
                camera.up.lerpVectors(transition.startUp, transition.endUp, tilt).normalize()
              } else {
                camera.position.copy(transition.path.getPoint(eased))
                cameraTarget.lerpVectors(transition.startTarget, transition.endTarget, eased)
                camera.up.lerpVectors(transition.startUp, transition.endUp, eased).normalize()
              }
              controls.target.copy(cameraTarget)
              updateCameraReadout()

              if (progress >= 1) {
                const destination = transition.destination
                const completedReverseTrays = Boolean(transition.targetPath && transition.reversePath && destination === 'home')

                if (transition.targetPath) {
                  const finalPathProgress = transition.reversePath ? 0 : 1
                  camera.position.copy(transition.path.getPointAt(finalPathProgress))
                  cameraTarget.copy(transition.targetPath.getPointAt(finalPathProgress))
                  const tiltStart = 0.60
                  const tiltProgress = THREE.MathUtils.clamp((finalPathProgress - tiltStart) / (1 - tiltStart), 0, 1)
                  const tilt = easeMotionControl(tiltProgress)
                  camera.up.lerpVectors(transition.startUp, transition.endUp, tilt).normalize()
                  controls.target.copy(cameraTarget)
                } else {
                  camera.position.copy(transition.path.getPoint(1))
                  cameraTarget.copy(transition.endTarget)
                  camera.up.copy(transition.endUp)
                  controls.target.copy(transition.endTarget)
                }

                cameraTransition = null
                viewMode = destination
                settleControls(destination === 'home')
                setZoomOutVisible(destination === 'map' || destination === 'radio' || destination === 'trays' || destination === 'closet')
                if (destination === 'home') selectDefault()
                if (completedReverseTrays) traysRoundTrip = null
              }
            }
          """
          text = text[:render_start] + render_block + text[render_end:]

          if 'traysSequence' in text:
              raise SystemExit('old staged trays sequence still present')
          if 'targetPath?: THREE.Curve<THREE.Vector3>' not in text:
              raise SystemExit('target path transition support missing')
          if "reversePath: true" not in text:
              raise SystemExit('reverse trays transition missing')
          if 'context.beginPath(); context.moveTo(0, y); context.lineTo(canvas.width, y); context.stroke()' not in text:
              raise SystemExit('map grid regression detected')

          path.write_text(text)
          PY

          git diff --check
          git diff -- apps/web/src/experience/operation-room.ts
          git rm .github/workflows/smooth-trays-roundtrip.yml

      - name: Commit smooth reversible trays camera
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make trays camera move continuous and exactly reversible'
          git push origin HEAD:rewrite/astro-payload
