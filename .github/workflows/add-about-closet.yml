name: Add ABOUT closet

on:
  push:
    branches:
      - 'rewrite/astro-payload'

permissions:
  contents: write

jobs:
  patch-about-closet:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0

      - name: Patch ABOUT closet and camera interaction
        run: python scripts/add-about-closet.py

      - name: Commit ABOUT closet
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/experience/operation-room.ts
          git commit -m 'Add animated ABOUT closet dolly view'
          git push origin HEAD:rewrite/astro-payload