name: Fix operation room hover behavior

on:
  push:
    branches:
      - rewrite/astro-payload

permissions:
  contents: write

jobs:
  patch-hover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0
      - name: Patch hover behavior
        run: python scripts/fix-operation-room-hover.py
      - name: Commit hover fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/experience/operation-room.ts
          git commit -m 'Make operation room hotspots hover-only'
          git push origin HEAD:rewrite/astro-payload
