name: Add map dolly camera

on:
  push:
    branches:
      - 'rewrite/astro-payload'

permissions:
  contents: write

jobs:
  patch-map-dolly:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0

      - name: Add map dolly interaction
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/experience/operation-room.ts')
          text = path.read_text()

          old = """  const HOME_POSITION = new THREE.Vector3(-5.08, 4.14, 8.58)
          const HOME_TARGET = new THREE.Vector3(-2.15, 2.7, -4.75)
          const TARGET_BOUNDS = { minX: -6, maxX: 4, minY: 0.8, maxY: 5.2, minZ: -5.8, maxZ: 4 }
          const controls = new OrbitControls(camera, canvas)
          controls.target.copy(HOME_TARGET)
          camera.position.copy(HOME_POSITION)
"""
          new = """  const HOME_POSITION = new THREE.Vector3(-5.08, 4.14, 8.58)
          const HOME_TARGET = new THREE.Vector3(-2.15, 2.7, -4.75)
          const MAP_TARGET = new THREE.Vector3(WORLD.map.x, WORLD.map.y, WORLD.map.z + 0.06)
          const TARGET_BOUNDS = { minX: -6, maxX: 4, minY: 0.8, maxY: 5.2, minZ: -5.8, maxZ: 4 }
          const cameraTarget = HOME_TARGET.clone()
          const controls = new OrbitControls(camera, canvas)
          controls.target.copy(HOME_TARGET)
          camera.position.copy(HOME_POSITION)
"""
          if old not in text:
              raise SystemExit('home camera block not found')
          text = text.replace(old, new, 1)

          old = """  let activeId: SectionId = 'work'; let frame = 0; let disposed = false
          let lastTime = performance.now()
          const FAN_SPEED = 4
"""
          new = """  let activeId: SectionId = 'work'; let frame = 0; let disposed = false
          let lastTime = performance.now()
          let viewMode: 'home' | 'transition' | 'map' = 'home'
          let cameraTransition: {
            startTime: number
            duration: number
            path: THREE.CatmullRomCurve3
            startTarget: THREE.Vector3
            endTarget: THREE.Vector3
          } | null = null
          const FAN_SPEED = 4
"""
          if old not in text:
              raise SystemExit('camera state block not found')
          text = text.replace(old, new, 1)

          old = """const selectDefault = () => { activeId = 'work'; boardDraw('WORK'); hotspots.forEach((hotspot) => { hotspot.highlight.visible = false }) }
          const resize = () => { const width = root.clientWidth; const height = root.clientHeight; renderer.setSize(width, height, false); camera.aspect = width / height; camera.fov = 54; camera.updateProjectionMatrix() }
          const updatePointer = (event: PointerEvent) => { const bounds = canvas.getBoundingClientRect(); pointer.x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1; pointer.y = -((event.clientY - bounds.top) / bounds.height) * 2 + 1 }
          const onPointerMove = (event: PointerEvent) => {
"""
          new = """const selectDefault = () => { activeId = 'work'; boardDraw('WORK'); hotspots.forEach((hotspot) => { hotspot.highlight.visible = false }) }
          const getMapViewPosition = () => {
            // Dolly close enough for the complete framed map to fill the viewport.
            // The distance is derived from both vertical and horizontal FOV so the
            // framing remains correct across wide and narrow desktop windows.
            const frameWidth = WORLD.map.width + 0.28
            const frameHeight = WORLD.map.height + 0.28
            const verticalHalfFov = THREE.MathUtils.degToRad(camera.fov * 0.5)
            const verticalDistance = (frameHeight * 0.5) / Math.tan(verticalHalfFov)
            const horizontalHalfFov = Math.atan(Math.tan(verticalHalfFov) * camera.aspect)
            const horizontalDistance = (frameWidth * 0.5) / Math.tan(horizontalHalfFov)
            const distance = Math.max(verticalDistance, horizontalDistance) * 1.015
            return new THREE.Vector3(WORLD.map.x, WORLD.map.y, WORLD.map.z + distance)
          }
          const resize = () => {
            const width = root.clientWidth
            const height = root.clientHeight
            renderer.setSize(width, height, false)
            camera.aspect = width / height
            camera.fov = 54
            camera.updateProjectionMatrix()
            if (viewMode === 'map') {
              camera.position.copy(getMapViewPosition())
              cameraTarget.copy(MAP_TARGET)
              controls.target.copy(MAP_TARGET)
            }
          }
          const updatePointer = (event: PointerEvent) => { const bounds = canvas.getBoundingClientRect(); pointer.x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1; pointer.y = -((event.clientY - bounds.top) / bounds.height) * 2 + 1 }
          const easeInOutCubic = (value: number) => value < 0.5
            ? 4 * value * value * value
            : 1 - Math.pow(-2 * value + 2, 3) / 2
          const startMapDolly = () => {
            if (viewMode !== 'home') return

            hoverTargets.forEach((target) => { target.material.opacity = 0 })
            hotspots.forEach((hotspot) => { hotspot.highlight.visible = false })
            boardDraw('WORK')

            const end = getMapViewPosition()
            if (reducedMotion.matches) {
              camera.position.copy(end)
              cameraTarget.copy(MAP_TARGET)
              controls.target.copy(MAP_TARGET)
              viewMode = 'map'
              return
            }

            const start = camera.position.clone()
            const direction = end.clone().sub(start)
            const firstGuide = start.clone().addScaledVector(direction, 0.34).add(new THREE.Vector3(0, 0.16, 0.28))
            const secondGuide = start.clone().addScaledVector(direction, 0.72).add(new THREE.Vector3(0.12, 0.08, 0.08))
            cameraTransition = {
              startTime: performance.now(),
              duration: 2200,
              path: new THREE.CatmullRomCurve3([start, firstGuide, secondGuide, end], false, 'catmullrom', 0.42),
              startTarget: cameraTarget.clone(),
              endTarget: MAP_TARGET.clone(),
            }
            viewMode = 'transition'
          }
          const onPointerUp = (event: PointerEvent) => {
            if (viewMode !== 'home') return
            updatePointer(event)
            hoverRaycaster.setFromCamera(pointer, camera)
            const hit = hoverRaycaster.intersectObjects(hoverTargets.map((target) => target.mesh), false)[0]?.object
            const target = hoverTargets.find((candidate) => candidate.mesh === hit)
            if (target?.id === 'map') startMapDolly()
          }
          const onPointerMove = (event: PointerEvent) => {
"""
          if old not in text:
              raise SystemExit('interaction block not found')
          text = text.replace(old, new, 1)

          old = """    // Desktop interaction is hover-only: moving the pointer over a menu region
            // immediately updates both the cover highlight and the hanging board.
            if (event.pointerType === 'touch') return
"""
          new = """    // Desktop interaction is hover-only: moving the pointer over a menu region
            // immediately updates both the cover highlight and the hanging board.
            if (event.pointerType === 'touch' || viewMode !== 'home') return
"""
          if old not in text:
              raise SystemExit('hover guard not found')
          text = text.replace(old, new, 1)

          old = """  const resetView = () => {
            camera.position.copy(HOME_POSITION)
            controls.target.copy(HOME_TARGET)
            controls.update()
          }
"""
          new = """  const resetView = () => {
            cameraTransition = null
            viewMode = 'home'
            camera.position.copy(HOME_POSITION)
            cameraTarget.copy(HOME_TARGET)
            controls.target.copy(HOME_TARGET)
            controls.update()
            selectDefault()
          }
"""
          if old not in text:
              raise SystemExit('reset block not found')
          text = text.replace(old, new, 1)

          old = """    if (!reducedMotion.matches) fanSpinner.rotation.z -= dt * FAN_SPEED
            updateClock()
            camera.lookAt(HOME_TARGET)
            renderer.render(scene, camera); frame = requestAnimationFrame(render)
"""
          new = """    if (!reducedMotion.matches) fanSpinner.rotation.z -= dt * FAN_SPEED
            updateClock()

            if (cameraTransition) {
              const elapsed = now - cameraTransition.startTime
              const progress = Math.min(elapsed / cameraTransition.duration, 1)
              const eased = easeInOutCubic(progress)
              camera.position.copy(cameraTransition.path.getPoint(eased))
              cameraTarget.lerpVectors(cameraTransition.startTarget, cameraTransition.endTarget, eased)
              controls.target.copy(cameraTarget)
              updateCameraReadout()

              if (progress >= 1) {
                camera.position.copy(getMapViewPosition())
                cameraTarget.copy(MAP_TARGET)
                controls.target.copy(MAP_TARGET)
                cameraTransition = null
                viewMode = 'map'
              }
            }

            camera.lookAt(cameraTarget)
            renderer.render(scene, camera); frame = requestAnimationFrame(render)
"""
          if old not in text:
              raise SystemExit('render block not found')
          text = text.replace(old, new, 1)

          old = """  canvas.addEventListener('pointermove', onPointerMove); canvas.addEventListener('keydown', onKeyDown); canvas.addEventListener('webglcontextlost', onContextLost); resetButton?.addEventListener('click', onResetClick); copyCameraButton?.addEventListener('click', onCopyCameraClick)
"""
          new = """  canvas.addEventListener('pointermove', onPointerMove); canvas.addEventListener('pointerup', onPointerUp); canvas.addEventListener('keydown', onKeyDown); canvas.addEventListener('webglcontextlost', onContextLost); resetButton?.addEventListener('click', onResetClick); copyCameraButton?.addEventListener('click', onCopyCameraClick)
"""
          if old not in text:
              raise SystemExit('listener add block not found')
          text = text.replace(old, new, 1)

          old = """    canvas.removeEventListener('pointermove', onPointerMove); canvas.removeEventListener('keydown', onKeyDown); canvas.removeEventListener('webglcontextlost', onContextLost); resetButton?.removeEventListener('click', onResetClick); copyCameraButton?.removeEventListener('click', onCopyCameraClick)
"""
          new = """    canvas.removeEventListener('pointermove', onPointerMove); canvas.removeEventListener('pointerup', onPointerUp); canvas.removeEventListener('keydown', onKeyDown); canvas.removeEventListener('webglcontextlost', onContextLost); resetButton?.removeEventListener('click', onResetClick); copyCameraButton?.removeEventListener('click', onCopyCameraClick)
"""
          if old not in text:
              raise SystemExit('listener remove block not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit map dolly
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/experience/operation-room.ts
          git commit -m 'Add cinematic map dolly camera'
          git push origin HEAD:rewrite/astro-payload
