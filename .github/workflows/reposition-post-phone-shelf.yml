name: Reposition post phone shelf

on:
  push:
    branches:
      - rewrite/astro-payload
    paths:
      - .github/workflows/reposition-post-phone-shelf.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0

      - name: Move phone shelf to table-facing side
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/experience/operation-room.ts')
          text = path.read_text()

          camera_start_marker = "  const getTraysViewPosition = () => {\n"
          camera_end_marker = "  const setProjectorActive = (active: boolean) => {\n"
          camera_start = text.index(camera_start_marker)
          camera_end = text.index(camera_end_marker)
          camera_before = text[camera_start:camera_end]

          replacements = [
              ("  // the two doors. The post itself is at x=3.3 / z=-1.9; +Z faces into the room.\n", "  // the two doors. Mount it on the -X face: that side faces the operations table.\n"),
              ("  const postFrontZ = postZ + 0.31\n", "  const postHalfWidth = 0.31\n  const tableFacingX = postX - postHalfWidth\n"),
              ("  const shelfY = 2.04\n", "  const shelfY = 2.34\n"),
              ("  const shelfCenterZ = postFrontZ + shelfDepth / 2 - 0.01\n", "  const shelfWidth = 0.96\n  const shelfCenterX = tableFacingX - shelfDepth / 2 + 0.01\n"),
              ("  scene.add(box([0.96, 0.10, shelfDepth], [postX, shelfY, shelfCenterZ], shelfWood))\n", "  scene.add(box([shelfDepth, 0.10, shelfWidth], [shelfCenterX, shelfY, postZ], shelfWood))\n"),
              ("  scene.add(box([0.78, 0.28, 0.08], [postX, shelfY - 0.15, postFrontZ + 0.035], bracketWood))\n", "  scene.add(box([0.08, 0.28, 0.78], [tableFacingX - 0.035, shelfY - 0.15, postZ], bracketWood))\n"),
              ("      [0.075, 0.075, 0.48],\n", "      [0.48, 0.075, 0.075],\n"),
              ("      [postX + side * 0.31, shelfY - 0.20, shelfCenterZ - 0.06],\n", "      [shelfCenterX + 0.06, shelfY - 0.20, postZ + side * 0.31],\n"),
              ("      [-0.66, 0, 0],\n", "      [0, 0, 0.66],\n"),
              ("  scene.add(cylinder(0.018, 1.25, [postX, 2.86, postFrontZ + 0.045], conduit, 7))\n", "  const conduitBottomY = shelfY + 0.12\n  const conduitTopY = 6.48\n  const conduitLength = conduitTopY - conduitBottomY\n  const conduitX = tableFacingX - 0.055\n  scene.add(cylinder(0.018, conduitLength, [conduitX, conduitBottomY + conduitLength / 2, postZ], conduit, 7))\n"),
              ("  scene.add(box([0.18, 0.26, 0.10], [postX, 2.56, postFrontZ + 0.055], terminal))\n", "  const terminalY = shelfY + 0.52\n  scene.add(box([0.10, 0.26, 0.18], [tableFacingX - 0.060, terminalY, postZ], terminal))\n"),
              ("  scene.add(box([0.12, 0.16, 0.025], [postX, 2.56, postFrontZ + 0.118], conduit))\n", "  scene.add(box([0.025, 0.16, 0.12], [tableFacingX - 0.118, terminalY, postZ], conduit))\n"),
              ("  createPhone(scene, postX, shelfCenterZ + 0.03, PALETTE.red, 0, shelfTop + 0.018, 0.58)\n", "  createPhone(scene, shelfCenterX - 0.03, postZ, PALETTE.red, -Math.PI / 2, shelfTop + 0.018, 0.58)\n"),
              ("    new THREE.Vector3(postX + 0.05, 2.43, postFrontZ + 0.11),\n", "    new THREE.Vector3(tableFacingX - 0.12, terminalY - 0.10, postZ + 0.03),\n"),
              ("    new THREE.Vector3(postX + 0.11, 2.30, postFrontZ + 0.18),\n", "    new THREE.Vector3(tableFacingX - 0.22, terminalY - 0.22, postZ + 0.05),\n"),
              ("    new THREE.Vector3(postX + 0.15, 2.18, shelfCenterZ - 0.13),\n", "    new THREE.Vector3(shelfCenterX + 0.08, shelfY + 0.28, postZ + 0.10),\n"),
              ("    new THREE.Vector3(postX + 0.23, shelfTop + 0.18, shelfCenterZ + 0.02),\n", "    new THREE.Vector3(shelfCenterX - 0.03, shelfTop + 0.16, postZ + 0.16),\n"),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected phone-shelf fragment: {old!r}')
              text = text.replace(old, new, 1)

          camera_start_after = text.index(camera_start_marker)
          camera_end_after = text.index(camera_end_marker)
          if text[camera_start_after:camera_end_after] != camera_before:
              raise SystemExit('camera/zoom transition changed unexpectedly')

          path.write_text(text)
          PY

      - name: Validate patch
        shell: bash
        run: |
          grep -q "const tableFacingX = postX - postHalfWidth" apps/web/src/experience/operation-room.ts
          grep -q "const shelfY = 2.34" apps/web/src/experience/operation-room.ts
          grep -q "const conduitTopY = 6.48" apps/web/src/experience/operation-room.ts
          grep -q "PALETTE.red, -Math.PI / 2" apps/web/src/experience/operation-room.ts
          ! grep -q "postFrontZ" apps/web/src/experience/operation-room.ts
          ! grep -q "shelfCenterZ" apps/web/src/experience/operation-room.ts

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reposition-post-phone-shelf.yml
          git add -A
          git commit -m "Move phone shelf to table-facing side of post"
          git push origin rewrite/astro-payload
