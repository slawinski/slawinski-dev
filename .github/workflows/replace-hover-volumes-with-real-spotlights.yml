name: Replace hover volumes with real spotlights

on:
  push:
    branches:
      - 'rewrite/astro-payload'

permissions:
  contents: write

jobs:
  patch-hover-lighting:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/astro-payload
          fetch-depth: 0

      - name: Replace fake hover cones with real spotlights
        run: python scripts/replace-hover-volumes-with-real-spotlights.py

      - name: Commit hover lighting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/experience/operation-room.ts
          git commit -m 'Make hover lighting respect scene geometry'
          git push origin HEAD:rewrite/astro-payload
